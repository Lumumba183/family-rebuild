<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Family Rebuild</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
            padding: 24px;
        }
        .success-card {
            background: white;
            padding: 60px 48px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #c9a227 0%, #e8d5a3 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 2rem;
            color: #1e3a5f;
        }
        .success-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #1e3a5f;
            margin-bottom: 12px;
        }
        .success-card p {
            color: #718096;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #c9a227;
            color: #1e3a5f;
        }
        .btn-primary:hover {
            background: #b8941f;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #1e3a5f;
            border: 2px solid #1e3a5f;
            margin-left: 12px;
        }
        .btn-outline:hover {
            background: #1e3a5f;
            color: white;
        }
        .contact-info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        .contact-info p {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .contact-info a {
            color: #c9a227;
            font-weight: 600;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            .success-card { padding: 40px 24px; }
            .btn-outline { margin-left: 0; margin-top: 12px; }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Message Sent Successfully!</h1>
        <p>Thank you for reaching out to Family Rebuild. We have received your message and will get back to you within 24 hours. God bless you!</p>
        <div>
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="blog.html" class="btn btn-outline">
                <i class="fas fa-book-open"></i> Read Our Blog
            </a>
        </div>
        <div class="contact-info">
            <p>Need urgent assistance?</p>
            <p><a href="https://wa.me/254700249344"><i class="fab fa-whatsapp"></i> WhatsApp Us: +254 700 249 344</a></p>
            <p><a href="mailto:familyrebuild2026@gmail.com"><i class="fas fa-envelope"></i> familyrebuild2026@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
